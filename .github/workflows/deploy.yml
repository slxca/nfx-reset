name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Update Manifest Version
        run: |
          NEW_VERSION=${GITHUB_REF#refs/tags/v}
          jq ".version = \"$NEW_VERSION\"" manifest.json > temp.json && mv temp.json manifest.json
          echo "Manifest updated to version $NEW_VERSION"

      - name: Create Extension Zip
        run: |
          mkdir -p extension
          cp manifest.json extension/
          cp -r dist/ extension/
          cp -r icons/ extension/
          cp -r _locales/ extension/
          cd extension && zip -r ../release.zip . && cd ..

      - name: Upload & Publish to Chrome Web Store
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: 'publish'
          client_id: ${{ secrets.CLIENT_ID }}
          client_secret: ${{ secrets.CLIENT_SECRET }}
          refresh_token: ${{ secrets.REFRESH_TOKEN }}
          extension_id: ${{ secrets.EXTENSION_ID }}
          zip_file: 'release.zip'
